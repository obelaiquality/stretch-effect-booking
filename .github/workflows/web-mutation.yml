name: Web mutation testing

on:
  pull_request:
    paths:
      - 'web/src/domain/**'
      - 'web/src/data/demoApi.ts'
      - 'web/stryker.config.json'
      - '.github/workflows/web-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Stryker (fails below the break threshold)
        run: npx stryker run --concurrency 2
        env:
          FC_SEED: '20261109'
          FC_RUNS: '40'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: web/reports/mutation/
