name: Web mutation testing

on:
  pull_request:
    paths:
      - 'web/src/domain/**'
      - 'web/src/data/demoApi.ts'
      - 'web/stryker.config.json'
      - '.github/workflows/web-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Stryker (fails below the break threshold)
        run: npx stryker run --concurrency 2
        env:
          FC_SEED: '20261109'
          FC_RUNS: '40'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: web/reports/mutation/
